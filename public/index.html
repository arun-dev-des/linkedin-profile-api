<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LinkedIn Profile API</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <style>
      :root {
        --bg: #f4f4f5;
        --card: #ffffff;
        --text: #18181b;
        --muted: #71717a;
        --border: #e4e4e7;
        --accent: #0a66c2;
        --accent-contrast: #ffffff;
        --danger: #b91c1c;
        --danger-bg: #fef2f2;
        --radius: 12px;
        --shadow: 0 1px 3px rgb(0 0 0 / 0.06), 0 8px 24px rgb(0 0 0 / 0.04);
        --jkey: #8250df;
        --jstr: #0a7d33;
        --jnum: #b26b00;
        --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #09090b;
          --card: #18181b;
          --text: #fafafa;
          --muted: #a1a1aa;
          --border: #27272a;
          --accent: #4098e6;
          --danger: #f87171;
          --danger-bg: #2a1414;
          --shadow: 0 1px 3px rgb(0 0 0 / 0.4), 0 8px 24px rgb(0 0 0 / 0.3);
          --jkey: #c9a2ff;
          --jstr: #6cc76c;
          --jnum: #e0a55c;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.55 'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        max-width: 1180px;
        margin: 0 auto;
        padding: 40px 20px 80px;
      }
      header h1 {
        font-size: 1.5rem;
        margin: 0 0 4px;
        letter-spacing: -0.01em;
      }
      header p {
        margin: 0 0 24px;
        color: var(--muted);
      }
      header a {
        color: var(--accent);
        text-decoration: none;
      }
      header a:hover {
        text-decoration: underline;
      }

      .controls {
        max-width: 640px;
      }
      form {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }
      input[type='text'] {
        flex: 1;
        min-width: 0;
        padding: 11px 14px;
        font-size: 15px;
        color: var(--text);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        outline: none;
      }
      input[type='text']:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgb(10 102 194 / 0.15);
      }
      button {
        padding: 11px 20px;
        font-size: 15px;
        font-weight: 600;
        color: var(--accent-contrast);
        background: var(--accent);
        border: 0;
        border-radius: var(--radius);
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .hint {
        font-size: 13px;
        color: var(--muted);
      }
      .hint a {
        color: var(--accent);
        text-decoration: none;
        cursor: pointer;
      }
      .hint a:hover {
        text-decoration: underline;
      }
      .opts {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--muted);
        margin: 8px 0 0;
      }
      .opts input {
        accent-color: var(--accent);
      }
      .opts label {
        cursor: pointer;
      }

      #status {
        margin-top: 24px;
      }
      .error {
        padding: 14px 16px;
        background: var(--danger-bg);
        color: var(--danger);
        border: 1px solid currentColor;
        border-radius: var(--radius);
        font-size: 14px;
      }
      .spinner {
        width: 22px;
        height: 22px;
        border: 2.5px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 32px auto;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ---- split ---- */
      .split {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 20px;
        margin-top: 24px;
        align-items: start;
      }
      @media (max-width: 900px) {
        .split {
          grid-template-columns: 1fr;
        }
      }
      .pane-json {
        position: sticky;
        top: 16px;
        display: flex;
        flex-direction: column;
        max-height: calc(100vh - 32px);
        min-height: 320px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }
      @media (max-width: 900px) {
        .pane-json {
          position: static;
          max-height: 70vh;
        }
      }
      .tabs {
        display: flex;
        align-items: stretch;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .tabs button {
        flex: 0 0 auto;
        padding: 10px 14px;
        font-family: inherit;
        font-size: 12.5px;
        font-weight: 500;
        color: var(--muted);
        background: none;
        border: 0;
        border-bottom: 2px solid transparent;
        border-radius: 0;
        cursor: pointer;
      }
      .tabs button.on {
        color: var(--text);
        border-bottom-color: var(--accent);
      }
      .tabs .copy-json {
        margin-left: auto;
        align-self: center;
        margin-right: 8px;
        padding: 4px 10px;
        font-size: 11px;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .tabs .copy-json:hover {
        color: var(--text);
      }
      .tab-body {
        overflow: auto;
        flex: 1;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.6;
      }
      .tab-body pre {
        margin: 0;
        padding: 14px 16px;
        white-space: pre;
      }
      .rawnote {
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        color: var(--muted);
        font-size: 11.5px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .jtree {
        padding: 12px 14px;
      }
      .jnode {
        padding-left: 13px;
      }
      .jrow {
        white-space: pre;
      }
      .jrow.br {
        cursor: pointer;
      }
      .jtw {
        display: inline-block;
        width: 11px;
        color: var(--muted);
        user-select: none;
      }
      .jkids.collapsed {
        display: none;
      }
      .jk {
        color: var(--jkey);
      }
      .js {
        color: var(--jstr);
      }
      .jn {
        color: var(--jnum);
      }
      .jb {
        color: var(--accent);
      }
      .jz {
        color: var(--muted);
        font-style: italic;
      }

      /* ---- profile card (left) ---- */
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .banner {
        height: 96px;
        background: linear-gradient(120deg, var(--accent), #63b3ed);
        background-size: cover;
        background-position: center;
      }
      .identity {
        padding: 0 24px 20px;
        margin-top: -44px;
      }
      .avatar {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        border: 4px solid var(--card);
        background: var(--border);
        object-fit: cover;
        display: block;
      }
      .identity h2 {
        margin: 12px 0 2px;
        font-size: 1.35rem;
        letter-spacing: -0.01em;
      }
      .identity .headline {
        margin: 0 0 6px;
      }
      .identity .meta {
        color: var(--muted);
        font-size: 13.5px;
      }
      .identity .meta a {
        color: var(--accent);
        text-decoration: none;
      }
      section.block {
        padding: 20px 24px;
        border-top: 1px solid var(--border);
      }
      section.block h3 {
        margin: 0 0 14px;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      .about {
        white-space: pre-wrap;
        margin: 0;
      }
      .entry {
        display: flex;
        gap: 12px;
        padding: 12px 0;
      }
      .entry + .entry {
        border-top: 1px solid var(--border);
      }
      .entry .logo {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        object-fit: contain;
        background: var(--bg);
        border: 1px solid var(--border);
        flex-shrink: 0;
      }
      .entry .logo.placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 15px;
        color: var(--muted);
      }
      .entry .body {
        min-width: 0;
      }
      .entry .title {
        font-weight: 600;
      }
      .entry .sub {
        color: var(--text);
        font-size: 14px;
      }
      .entry .dates {
        color: var(--muted);
        font-size: 13px;
        margin-top: 1px;
      }
      .entry .desc {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 13.5px;
        white-space: pre-wrap;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        padding: 5px 11px;
        font-size: 13px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      ul.links {
        margin: 0;
        padding-left: 18px;
      }
      ul.links a {
        color: var(--accent);
        text-decoration: none;
      }
      .partial-note {
        margin-top: 10px;
        font-size: 12.5px;
        color: var(--muted);
      }
      .card footer {
        padding: 14px 24px;
        border-top: 1px solid var(--border);
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>LinkedIn Profile API</h1>
        <p>
          Paste a LinkedIn profile URL to get it back as structured JSON.
          <a href="https://github.com/arun-dev-des/linkedin-profile-api" target="_blank" rel="noopener"
            >Source &amp; docs</a
          >.
        </p>
      </header>

      <div class="controls">
        <form id="form">
          <input
            id="url"
            type="text"
            placeholder="https://www.linkedin.com/in/…"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
          />
          <button id="go" type="submit">Fetch</button>
        </form>
        <p class="hint">
          Try <a data-sample>the sample response</a>, or <a data-example>an example profile</a>.
        </p>
        <p class="opts">
          <input type="checkbox" id="full" />
          <label for="full"
            >Complete skills &amp; experience &mdash; one extra request per section LinkedIn
            capped (20 skills, 10 companies' worth of roles) (<code>?full=1</code>)</label
          >
        </p>
      </div>

      <div id="status" aria-live="polite"></div>
      <div id="result"></div>
    </div>

    <script>
      const $ = (sel) => document.querySelector(sel);
      const form = $('#form');
      const urlInput = $('#url');
      const goBtn = $('#go');
      const fullBox = $('#full');
      const statusEl = $('#status');
      const resultEl = $('#result');
      const EXAMPLE = 'https://www.linkedin.com/in/iamarun4official/';

      // Same-origin when served by the API itself; an absolute URL when the
      // widget is embedded on the separately-hosted showcase site.
      const API_BASE = window.API_BASE ?? '';

      let lastData = null; // normalized envelope { profile, meta }
      let lastRaw = null; // unprocessed Voyager payload (lazy)
      let lastUrl = null; // the LinkedIn URL behind lastData (null for the sample)
      let jsonTab = 'tree';

      const profilePath = (linkedinUrl) =>
        `/profile?url=${encodeURIComponent(linkedinUrl)}${fullBox.checked ? '&full=1' : ''}`;

      const esc = (s) =>
        String(s ?? '').replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );

      const humanize = (s) =>
        !s
          ? ''
          : String(s)
              .toLowerCase()
              .replace(/_/g, ' ')
              .replace(/^./, (c) => c.toUpperCase());

      const dateSpan = (a, b, current) => {
        if (!a && !b) return '';
        return `${a ?? ''}${a || b ? ' – ' : ''}${current ? 'Present' : (b ?? '')}`.trim();
      };

      /* ---------------- JSON tree ---------------- */
      function jval(v) {
        if (v === null) return '<span class="jz">null</span>';
        const t = typeof v;
        if (t === 'string') return `<span class="js">"${esc(v)}"</span>`;
        if (t === 'number') return `<span class="jn">${v}</span>`;
        if (t === 'boolean') return `<span class="jb">${v}</span>`;
        return esc(String(v));
      }
      function jnode(key, val, depth) {
        const kh = key != null ? `<span class="jk">${esc(key)}</span>: ` : '';
        if (val === null || typeof val !== 'object') {
          return `<div class="jnode"><div class="jrow">${kh}${jval(val)}</div></div>`;
        }
        const arr = Array.isArray(val);
        const entries = arr ? val.map((v, i) => [i, v]) : Object.entries(val);
        const collapsed = depth >= 2 && entries.length > 0;
        const kids =
          entries.map(([k, v]) => jnode(k, v, depth + 1)).join('') +
          `<div class="jrow jz">${arr ? ']' : '}'}</div>`;
        return (
          `<div class="jnode"><div class="jrow br"><span class="jtw">${collapsed ? '▸' : '▾'}</span>` +
          `${kh}${arr ? '[' : '{'} <span class="jz">${entries.length} ${arr ? 'items' : 'keys'}</span></div>` +
          `<div class="jkids${collapsed ? ' collapsed' : ''}">${kids}</div></div>`
        );
      }

      /* ---------------- right pane: JSON ---------------- */
      function jsonPane() {
        return `
          <div class="pane-json">
            <div class="tabs">
              <button data-jtab="tree"${jsonTab === 'tree' ? ' class="on"' : ''}>Tree</button>
              <button data-jtab="raw"${jsonTab === 'raw' ? ' class="on"' : ''}>Raw</button>
              <button data-jtab="full"${jsonTab === 'full' ? ' class="on"' : ''}>Full JSON · not normalised</button>
              <button type="button" class="copy-json" data-copy-json>Copy</button>
            </div>
            <div class="tab-body" id="jbody"></div>
          </div>`;
      }

      async function copyCurrentJson(btn) {
        const payload = jsonTab === 'full' ? lastRaw : lastData;
        if (!payload) return;
        try {
          await navigator.clipboard.writeText(JSON.stringify(payload, null, 2));
          btn.textContent = 'Copied';
          setTimeout(() => (btn.textContent = 'Copy'), 1400);
        } catch {
          /* clipboard blocked */
        }
      }
      function renderJsonTab() {
        const body = $('#jbody');
        if (!body) return;
        if (jsonTab === 'tree') {
          body.innerHTML = `<div class="jtree">${jnode(null, lastData, 0)}</div>`;
        } else if (jsonTab === 'raw') {
          body.innerHTML = `<pre>${esc(JSON.stringify(lastData, null, 2))}</pre>`;
        } else {
          renderRawTab(body);
        }
      }
      async function renderRawTab(body) {
        if (lastRaw) {
          const n = (lastRaw.included ?? []).length;
          const kb = (JSON.stringify(lastRaw).length / 1024).toFixed(0);
          body.innerHTML =
            `<div class="rawnote">The unprocessed Voyager payload — ${kb}&nbsp;KB, ` +
            `${n} entities in <code>included[]</code>, cross-referenced by URN. ` +
            `<code>src/linkedin/normalize.js</code> turns this into the tree on the left.</div>` +
            `<div class="jtree">${jnode(null, lastRaw, 0)}</div>`;
          return;
        }
        body.innerHTML = '<div class="spinner"></div>';
        const path =
          lastData?.meta?.source === 'cached-fixture'
            ? '/profile/sample/raw'
            : lastUrl && `/profile/raw?url=${encodeURIComponent(lastUrl)}`;
        if (!path) {
          body.innerHTML = '<div class="rawnote">No raw payload available for this result.</div>';
          return;
        }
        try {
          const res = await fetch(API_BASE + path);
          const data = await res.json();
          if (!res.ok) throw new Error(data.error?.message ?? `Request failed (${res.status}).`);
          lastRaw = data;
          if (jsonTab === 'full') renderRawTab(body);
        } catch (err) {
          body.innerHTML = `<div class="rawnote" style="color:var(--danger)">${esc(err.message)}</div>`;
        }
      }

      /* ---------------- left pane: profile card ---------------- */
      function entry({ logo, title, sub, dates, desc }) {
        const initial = esc((sub || title || '?').trim().charAt(0).toUpperCase());
        const img = logo
          ? `<img class="logo" src="${esc(logo)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'logo placeholder',textContent:'${initial}'}))">`
          : `<div class="logo placeholder">${initial}</div>`;
        return `
          <div class="entry">
            ${img}
            <div class="body">
              <div class="title">${esc(title)}</div>
              ${sub ? `<div class="sub">${esc(sub)}</div>` : ''}
              ${dates ? `<div class="dates">${esc(dates)}</div>` : ''}
              ${desc ? `<p class="desc">${esc(desc)}</p>` : ''}
            </div>
          </div>`;
      }
      function block(title, inner) {
        return inner ? `<section class="block"><h3>${esc(title)}</h3>${inner}</section>` : '';
      }
      function profileCard(data) {
        const p = data.profile;
        const m = data.meta ?? {};

        const banner = p.images?.backgroundImage
          ? ` style="background-image:url('${esc(p.images.backgroundImage)}')"`
          : '';
        const avatar = p.images?.profilePicture
          ? `<img class="avatar" src="${esc(p.images.profilePicture)}" alt="" onerror="this.style.visibility='hidden'">`
          : `<div class="avatar"></div>`;
        const metaLine = [p.location, p.industry].filter(Boolean).map(esc).join(' · ');

        const experience = (p.experience ?? []).length
          ? (p.experience ?? [])
              .map((e) =>
                entry({
                  logo: e.companyLogo,
                  title: e.title,
                  sub: [e.company, e.employmentType].filter(Boolean).join(' · '),
                  dates: [dateSpan(e.startDate, e.endDate, e.current), e.location]
                    .filter(Boolean)
                    .join('  ·  '),
                  desc: e.description,
                }),
              )
              .join('') +
            (m.partial?.experience
              ? `<p class="partial-note">Showing ${m.partial.experience.returnedGroups} of ${m.partial.experience.totalGroups} companies — tick "Complete skills &amp; experience" above.</p>`
              : '')
          : '';

        const education = (p.education ?? [])
          .map((e) => {
            const degreeLine = [e.degree, e.fieldOfStudy].filter(Boolean).join(', ');
            return entry({
              logo: e.schoolLogo,
              title: e.school || degreeLine || 'Education',
              sub: e.school ? degreeLine : '',
              dates: dateSpan(e.startDate, e.endDate, e.current),
              desc: e.description,
            });
          })
          .join('');

        const certs = (p.certifications ?? [])
          .map((c) =>
            entry({
              title: c.name,
              sub: c.authority,
              dates: [dateSpan(c.startDate, c.endDate, c.current), c.licenseNumber]
                .filter(Boolean)
                .join('  ·  '),
            }),
          )
          .join('');

        const skills = (p.skills ?? []).length
          ? `<div class="chips">${p.skills.map((s) => `<span class="chip">${esc(s)}</span>`).join('')}</div>` +
            (m.partial?.skills
              ? `<p class="partial-note">Showing ${m.partial.skills.returned} of ${m.partial.skills.total} — tick "Complete skills list" above.</p>`
              : '')
          : '';

        const languages = (p.languages ?? []).length
          ? `<div class="chips">${p.languages
              .map(
                (l) =>
                  `<span class="chip">${esc(l.name)}${
                    l.proficiency ? ` · ${esc(humanize(l.proficiency))}` : ''
                  }</span>`,
              )
              .join('')}</div>`
          : '';

        const featured = (p.featured ?? []).length
          ? `<ul class="links">${p.featured
              .map(
                (f) =>
                  `<li><a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(
                    f.title || f.url,
                  )}</a>${f.provider ? ` <span class="dates">— ${esc(f.provider)}</span>` : ''}</li>`,
              )
              .join('')}</ul>` +
            (m.partial?.featured
              ? `<p class="partial-note">Showing ${m.partial.featured.returned} of ${m.partial.featured.total} — LinkedIn caps this section server-side, there's no complete-list request that helps.</p>`
              : '')
          : '';

        return `
          <div class="card">
            <div class="banner"${banner}></div>
            <div class="identity">
              ${avatar}
              <h2>${esc(p.name ?? 'Unknown')}</h2>
              ${p.headline ? `<p class="headline">${esc(p.headline)}</p>` : ''}
              <div class="meta">
                ${metaLine}
                ${
                  p.profileUrl
                    ? ` · <a href="${esc(p.profileUrl)}" target="_blank" rel="noopener">LinkedIn ↗</a>`
                    : ''
                }
              </div>
            </div>
            ${block('About', p.about ? `<p class="about">${esc(p.about)}</p>` : '')}
            ${block('Experience', experience)}
            ${block('Education', education)}
            ${block('Skills', skills)}
            ${block('Certifications', certs)}
            ${block('Languages', languages)}
            ${block('Featured', featured)}
            <footer>
              ${m.cached ? 'cached' : 'fetched'} ${
                m.fetchedAt ? esc(new Date(m.fetchedAt).toLocaleString()) : ''
              }${m.source ? ` · ${esc(m.source)}` : ''}
            </footer>
          </div>`;
      }

      function render(data) {
        lastData = data;
        resultEl.innerHTML = `<div class="split"><div class="pane-ui">${profileCard(
          data,
        )}</div>${jsonPane()}</div>`;
        renderJsonTab();
      }

      /* ---------------- fetch + events ---------------- */
      async function load(path, { pushUrl, linkedinUrl = null } = {}) {
        goBtn.disabled = true;
        statusEl.innerHTML = '<div class="spinner"></div>';
        resultEl.innerHTML = '';
        lastRaw = null;
        lastUrl = linkedinUrl;
        try {
          const res = await fetch(API_BASE + path);
          const data = await res.json();
          statusEl.innerHTML = '';
          if (!res.ok) {
            statusEl.innerHTML = `<div class="error">${esc(
              data.error?.message ?? `Request failed (${res.status}).`,
            )}</div>`;
            return;
          }
          render(data);
          if (pushUrl) history.replaceState(null, '', pushUrl);
        } catch (err) {
          statusEl.innerHTML = `<div class="error">${esc(err.message)}</div>`;
        } finally {
          goBtn.disabled = false;
        }
      }

      function submitUrl(value) {
        const pushed = new URLSearchParams({ url: value });
        if (fullBox.checked) pushed.set('full', '1');
        load(profilePath(value), {
          pushUrl: `${location.pathname}?${pushed}`,
          linkedinUrl: value,
        });
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const value = urlInput.value.trim();
        if (value) submitUrl(value);
      });

      fullBox.addEventListener('change', () => {
        const value = urlInput.value.trim();
        if (value && lastData?.meta?.source !== 'cached-fixture') submitUrl(value);
      });

      document.addEventListener('click', (e) => {
        const link = e.target.closest('a');
        if (link?.dataset.sample !== undefined) {
          e.preventDefault();
          load('/profile/sample');
          return;
        }
        if (link?.dataset.example !== undefined) {
          e.preventDefault();
          urlInput.value = EXAMPLE;
          submitUrl(EXAMPLE);
          return;
        }

        const copyBtn = e.target.closest('[data-copy-json]');
        if (copyBtn) {
          copyCurrentJson(copyBtn);
          return;
        }

        const tab = e.target.closest('[data-jtab]');
        if (tab) {
          jsonTab = tab.dataset.jtab;
          document
            .querySelectorAll('[data-jtab]')
            .forEach((b) => b.classList.toggle('on', b === tab));
          renderJsonTab();
          return;
        }

        const branch = e.target.closest('.jrow.br');
        if (branch) {
          const kids = branch.nextElementSibling;
          const hidden = kids.classList.toggle('collapsed');
          branch.querySelector('.jtw').textContent = hidden ? '▸' : '▾';
        }
      });

      // Deep-link: /?url=…&full=1
      const params = new URLSearchParams(location.search);
      const preset = params.get('url');
      if (preset) {
        urlInput.value = preset;
        fullBox.checked = params.get('full') === '1';
        load(profilePath(preset), { linkedinUrl: preset });
      }
    </script>
  </body>
</html>
